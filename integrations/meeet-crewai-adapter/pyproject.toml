[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeet-trust"
version = "0.1.0"
description = "MEEET World trust guard for CrewAI, AutoGen, and LangGraph agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hermes King", email = "hermes@meeet.world"},
]
keywords = ["meeet", "ai-agents", "crewai", "autogen", "langgraph", "trust", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
crewai = ["crewai>=0.80"]
autogen = ["autogen>=0.2"]
langgraph = ["langgraph>=0.0.20"]
all = [
    "crewai>=0.80",
    "autogen>=0.2",
    "langgraph>=0.0.20",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "responses>=0.21",
    "crewai>=0.80",
    "autogen>=0.2",
    "langgraph>=0.0.20",
]

[project.urls]
Homepage = "https://meeet.world/developer"
Documentation = "https://meeet.world/developer"
Repository = "https://github.com/alxvasilevvv/meeet-solana-state"
Issues = "https://github.com/alxvasilevvv/meeet-solana-state/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
